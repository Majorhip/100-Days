<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1420">
<title>Stranded: 100 Days on Kestrel Island</title>
<link rel="stylesheet" href="/src/ui/styles.css">
</head>
<body>
<div id="loading"><div class="sp">🏝️</div>Building Kestrel Island...</div>
<div id="hud" style="display:none">
  <div id="cross"></div><div id="prompt"></div><div id="hint"></div>
  <div id="quest"></div>
  <div id="compass"><div id="compassIn"></div></div>
  <div id="bossbar" style="display:none"><div id="bossname"></div><div class="bbar"><div id="bossfill"></div></div></div>
  <div id="focus" style="display:none"><div id="focusname"></div><div class="fbar"><div id="focusfill"></div></div></div>
  <div id="clockbox"><div id="day">DAY 1</div><div id="time"></div><div><span id="weather"></span> <span id="temp"></span></div><div id="dayline"><div id="dayprog"></div></div><canvas id="minimap" width="150" height="150"></canvas><div id="mmlabel">🗺️ click or <kbd>M</kbd></div></div>
  <div id="meters"></div>
  <div id="hotwrap"><div id="hotbar"></div><div id="xpline"><span id="lvl">LV 1</span><div id="xpbar"><div id="xpf"></div></div></div><div id="canteen" style="display:none"></div></div>
  <div id="toasts"></div><div id="loot"></div><div id="banner"></div>
</div>
<div id="nums"></div><div id="vignette"></div><div id="flash"></div><div id="fade"></div>
<div id="panel"><div id="panelBox"></div></div>
<div id="title" style="display:none"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
